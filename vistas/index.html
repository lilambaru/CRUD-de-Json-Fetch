<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Clavo · Catálogo de existencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../public/css/estilo.css" rel="stylesheet">
</head>
<body>

  <header class="cabecera-clavo">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <div>
        <h1 class="h4 mb-0 fw-bold">Ferretería El Clavo</h1>
        <small class="text-secondary">Catálogo de existencias · Desarrollo Web</small>
      </div>
      <span class="badge rounded-pill text-bg-warning" id="contadorItems">0 productos</span>
    </div>
  </header>

  <main class="container my-4">
    <div class="row g-4">

      <!-- columna del formulario -->
      <section class="col-lg-4">
        <div class="card tarjeta-clavo shadow-sm">
          <div class="card-header d-flex align-items-center justify-content-between">
            <span class="fw-semibold" id="tituloFormulario">Registrar producto</span>
            <span class="badge text-bg-dark" id="etiquetaModo">Nuevo</span>
          </div>
          <div class="card-body">

            <div class="alert alert-danger d-none" role="alert" id="avisoFormulario"></div>

            <form id="formProducto" novalidate autocomplete="off">
              <input type="hidden" name="Id" id="Id">

              <div class="mb-3">
                <label for="Codigo" class="form-label">Código</label>
                <input class="form-control text-uppercase" type="text" name="Codigo" id="Codigo"
                       maxlength="20" placeholder="TAL-650">
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="Producto" class="form-label">Producto</label>
                <input class="form-control" type="text" name="Producto" id="Producto"
                       maxlength="100" placeholder="Taladro 650W">
                <div class="invalid-feedback"></div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label for="Precio" class="form-label">Precio (USD)</label>
                  <input class="form-control" type="number" step="0.01" min="0.01" name="Precio" id="Precio"
                         placeholder="58.90">
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-6">
                  <label for="Cantidad" class="form-label">Cantidad</label>
                  <input class="form-control" type="number" step="1" min="1" name="Cantidad" id="Cantidad"
                         placeholder="10">
                  <div class="invalid-feedback"></div>
                </div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-warning fw-semibold" id="btnGuardar">
                  <span class="spinner-border spinner-border-sm me-2 d-none" id="giroGuardar" aria-hidden="true"></span>
                  <span id="textoBtnGuardar">Registrar</span>
                </button>
                <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelarEdicion">
                  Cancelar edición
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- columna de la tabla y el buscador -->
      <section class="col-lg-8">
        <div class="card tarjeta-clavo shadow-sm">
          <div class="card-header">
            <div class="row g-2 align-items-center">
              <div class="col-md-5"><span class="fw-semibold">Inventario</span></div>
              <div class="col-md-7">
                <input type="search" class="form-control" id="buscador"
                       placeholder="Buscar por código o nombre…" aria-label="Buscar productos">
              </div>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Producto</th>
                  <th class="text-end">Precio</th>
                  <th class="text-end">Cantidad</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="cuerpoTabla"></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="text-center text-secondary small pb-4">
    Javier Vallarino (8-1040-1488) · Ambar Greco (0-000-0000)
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../public/js/script.js"></script>
</body>
</html>
